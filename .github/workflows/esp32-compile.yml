name: ESP32-S3 compile smoke test
on:
  pull_request:
    paths: ['firmware/**', 'tests/esp32_compile/**', '.github/workflows/esp32-compile.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'platformio==6.1.18'
      - name: Compile ESP32-S3 components
        shell: bash
        run: |
          set -o pipefail
          pio run --project-dir tests/esp32_compile 2>&1 | tee "$RUNNER_TEMP/esp32-build.log"
      - name: Compile hardware verification program
        shell: bash
        run: |
          set -o pipefail
          pio run --project-dir firmware/hardware-test 2>&1 | tee -a "$RUNNER_TEMP/esp32-build.log"
      - name: Report compile failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/esp32-build.log" ]; then
            message=$(tail -n 80 "$RUNNER_TEMP/esp32-build.log")
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            printf '::error::%s\n' "$message"
          fi
