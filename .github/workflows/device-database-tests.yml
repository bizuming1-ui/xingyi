name: Device database isolation tests
on:
  pull_request:
    paths: ['supabase/**', 'tests/database/**', '.github/workflows/device-database-tests.yml']
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tests/database
      - run: npm test --prefix tests/database
