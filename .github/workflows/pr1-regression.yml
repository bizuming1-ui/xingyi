name: PR1 browser regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix tests/e2e
      - run: npm test --prefix tests/e2e
